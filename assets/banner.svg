<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="12" fill="url(#bg)"/>
  <g opacity="0.04" stroke="#58a6ff" stroke-width="0.5">
    <line x1="0" y1="50" x2="1200" y2="50"/><line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="150" x2="1200" y2="150"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="100" y1="0" x2="100" y2="300"/><line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/><line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="500" y1="0" x2="500" y2="300"/><line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="700" y1="0" x2="700" y2="300"/><line x1="800" y1="0" x2="800" y2="300"/>
    <line x1="900" y1="0" x2="900" y2="300"/><line x1="1000" y1="0" x2="1000" y2="300"/>
    <line x1="1100" y1="0" x2="1100" y2="300"/>
  </g>
  <!-- Shield icon -->
  <g transform="translate(280, 80)">
    <path d="M0 10 L40 0 L80 10 L80 55 C80 85 40 110 40 110 C40 110 0 85 0 55 Z" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.9"/>
    <path d="M28 52 L38 62 L56 40" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Raspberry Pi logo silhouette -->
  <g transform="translate(835, 60)" opacity="0.2">
    <!-- Stem -->
    <rect x="36" y="0" width="4" height="18" rx="2" fill="#3fb950"/>
    <!-- Left leaf -->
    <path d="M38 18 C28 8 12 10 14 20 C16 28 30 26 38 22" fill="#3fb950" opacity="0.8"/>
    <!-- Right leaf -->
    <path d="M38 18 C48 8 64 10 62 20 C60 28 46 26 38 22" fill="#3fb950" opacity="0.8"/>
    <!-- Berry cluster - top row -->
    <circle cx="28" cy="40" r="10" fill="#c51a4a"/>
    <circle cx="48" cy="40" r="10" fill="#c51a4a"/>
    <!-- Middle row -->
    <circle cx="18" cy="58" r="10" fill="#c51a4a"/>
    <circle cx="38" cy="55" r="10" fill="#c51a4a"/>
    <circle cx="58" cy="58" r="10" fill="#c51a4a"/>
    <!-- Bottom row -->
    <circle cx="24" cy="76" r="10" fill="#c51a4a"/>
    <circle cx="52" cy="76" r="10" fill="#c51a4a"/>
    <circle cx="38" cy="72" r="8" fill="#c51a4a"/>
    <!-- Bottom -->
    <circle cx="38" cy="88" r="7" fill="#c51a4a"/>
    <!-- Subtle highlight dots on berries -->
    <circle cx="24" cy="37" r="2.5" fill="#fff" opacity="0.15"/>
    <circle cx="44" cy="37" r="2.5" fill="#fff" opacity="0.15"/>
    <circle cx="14" cy="55" r="2.5" fill="#fff" opacity="0.15"/>
    <circle cx="34" cy="52" r="2.5" fill="#fff" opacity="0.15"/>
    <circle cx="54" cy="55" r="2.5" fill="#fff" opacity="0.15"/>
  </g>
  <!-- Title text -->
  <text x="400" y="145" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#e6edf3" letter-spacing="-0.5">OpenClaw</text>
  <text x="400" y="185" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#8b949e" letter-spacing="0.5">on Raspberry Pi 5</text>
  <text x="400" y="225" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#58a6ff" letter-spacing="2">SECURITY-FIRST INSTALLATION GUIDE</text>
  <rect x="400" y="198" width="60" height="2" rx="1" fill="url(#accent)" opacity="0.6"/>
  <rect x="0" y="296" width="1200" height="4" fill="url(#accent)" opacity="0.4"/>
</svg>
